{% extends 'base.html' %}
{% block conteudo %}
<div class="barra-titulo-linha">
    <span>Clientes</span>
</div>

{% if not editar %}
    <div class="container-botao-direita">
        <a href="{{ url_for('clientes') }}" class="btn-enviar-rosa">Novo cliente</a>
    </div>
    {% endif %}

    {% if request.endpoint == 'clientes' %}
        <section class="painel formulario">
            <h2>Novo cliente</h2>

            <form method="POST" action="{{ url_for('cadastro_cliente') }}">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: João">
                </div>
                <div class="linha-campos">
                    <div class="campo">
                        <label for="datanascimento">Data de nascimento</label>
                        <input type="date" id="datanascimento" name="datanascimento" placeholder="Ex: 00/00/0000">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="campo">
                        <label for="cpfcnpj">CPF/CNPJ</label>
                        <input type="text" id="cpfcnpj" name="cpfcnpj" placeholder="000.000.000-00">
                    </div>
                    <div class="campo">
                        <label for="departamento">Departamento</label>
                        <select id="departamento" name="departamento">
                            <option value="opcao1">Opção 1</option>
                            <option value="opcao2">Opção 2</option>
                            <option value="opcao3">Opção 3</option>
                        </select>
                    </div>
                </div>
                <!-- Adicionado botão de envio dentro do formulário -->
                <div class="acoes-formulario">
                    <button type="submit" class="botao">Salvar</button>
                </div>
            </form>
        </section>
    {% endif %}
{% endblock %}
