{% extends 'base.html' %}
{% block conteudo %}
  <div class="cabecalho-pagina">
        <div>
            <h1>Equipamentos</h1>
            <p class="subtitulo">Cadastro dos equipamentos Quarks</p>
        </div>
        {% if not editar %}
            <a href="{{ url_for('equipamentos') }}" class="botao">Novo equipamento</a>
        {% endif %}
    </div>

    {% if request.endpoint == 'equipamentos' %}
        <section class="painel formulario">
            <h2>Novo equipamento</h2>
            <form method="POST" action="{{ url_for('cadastro_equipamento') }}">
                <div class="campo">
                    <label for="nome_equipamento">Nome do equipamento</label>
                    <input type="text" id="nome_equipamento" name="nome_equipamento" required placeholder="Ex: Máquina 1">
                </div>
                <div class="linha-campos">
                    <div class="campo">
                        <label for="quantidade_estoque">Quantidade do estoque</label>
                        <input type="number" id="quantidade_estoque" name="quantidade_estoque" placeholder="Ex: 2">
                    </div>
                     <div class="campo">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" name="modelo">
                    </div>
                    <div class="campo">
                        <label for="numero_serie">Número de série</label>
                        <input type="number" id="numero_serie" name="numero_serie" placeholder="Ex: n3678">
                    </div>
                </div>
                <div class="acoes-formulario">
                    <button type="submit" class="botao">Salvar</button>
                </div>
            </form>
        </section>
    {% endif %}
{% endblock %}
