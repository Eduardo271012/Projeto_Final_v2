{% extends 'base.html' %}
{% block conteudo %}
    <div class="cabecalho-pagina">
        <div>
            <h1>Funcionários</h1>
            <p class="subtitulo">Cadastro dos funcionários Quarks</p>
        </div>
        {% if not editar %}
            <a href="{{ url_for('cadastro_funcionario') }}" class="botao">Cadastrar funcionário</a>
        {% endif %}
    </div>

    {% if request.endpoint == 'cadastro_funcionario' %}
        <section class="painel formulario">
            <h2>Novo funcionário</h2>
            <form method="POST" action="{{ url_for('cadastro_funcionario') }}">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: João">
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Ex: aaaaa@gmail.com">
                </div>
                <div class="campo">
                    <label for="setor">Setor</label>
                    <select id="setor" name="setor">
                        {% if setores %}
                            {% for setor in setores %}
                                <option value="{{ setor.id }}">{{ setor.nome }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="">Não Existem Setores Cadastrados</option>
                        {% endif %}
                    </select>
                </div>
                <div class="campo">
                    <label for="funcao">Função</label>
                    <select id="funcao" name="funcao">
                        <option value="opcao1">Opção 1</option>
                        <option value="opcao2">Opção 2</option>
                        <option value="opcao3">Opção 3</option>
                    </select>
                </div>
                </div>
                <div class="acoes-formulario">
                    <button type="submit" class="botao">Salvar</button>
                </div>
            </form>
        </section>
    {% endif %}
{% endblock %}
